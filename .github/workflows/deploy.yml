# テストと自動公開
# - プッシュ・プルリクエストのたびに：型チェック・テスト・ルールのテスト・ビルド
# - 既定のブランチに入ったとき（プルリクエストをマージしたとき）だけ：テストが通ったら Firebase に公開
#   （画面・Firestore のルール・タイムラインを消す TTL の設定）
# 公開には、リポジトリの Secret「FIREBASE_SERVICE_ACCOUNT」が必要（設定方法は README）
name: test-and-deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Firestore エミュレーター（ルールのテスト）に Java が必要
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rules
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # 公開が重ならないように、前の公開が終わるのを待つ
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Secret があるか確かめる
        id: secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::Secret FIREBASE_SERVICE_ACCOUNT が無いので公開をとばしました（README の「自動で公開する」を参照）"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secret.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.secret.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.secret.outputs.ok == 'true'
        run: npm ci
      - if: steps.secret.outputs.ok == 'true'
        run: npm run build
      - if: steps.secret.outputs.ok == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - if: steps.secret.outputs.ok == 'true'
        name: Firebase に公開
        run: npx firebase deploy --only hosting,firestore --non-interactive
